[package]
name = "vaultagent-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client VaultAgent : association, lecture, écriture, déverrouillage et remplissage, avec sorties JSON versionnées."

[lints]
workspace = true

[lib]
name = "vaultagent_client"
path = "src/lib.rs"

[[bin]]
name = "vaultagent"
path = "src/main.rs"

[dependencies]
vaultagent-core = { path = "../vaultagent-core" }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
ureq.workspace = true
clap.workspace = true

[dev-dependencies]
p256.workspace = true

[target.'cfg(windows)'.dependencies]
vaultagent-win32 = { path = "../vaultagent-win32" }
