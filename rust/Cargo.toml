[workspace]
resolver = "3"
members = [
    "vaultagent-core",
    "vaultagent-engine",
    "vaultagent-server",
    "vaultagent-client",
    "vaultagent-win32",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
