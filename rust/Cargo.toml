[workspace]
resolver = "3"
members = [
    "vaultagent-core",
    "vaultagent-engine",
    "vaultagent-server",
    "vaultagent-client",
    "vaultagent-win32",
    "vaultagent-parity",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
subtle = { version = "2.6", default-features = false, features = ["std"] }
getrandom = { version = "0.2", default-features = false }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957", features = ["internal"] }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-auth = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-sync = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-state = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-collections = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
bitwarden-pm = { git = "https://github.com/bitwarden/sdk-internal", rev = "6238472451e4fa7b5c592b4b24a84e950a258957" }
tokio = { version = "1", default-features = false, features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
async-trait = "0.1"
tiny_http = { version = "0.12", default-features = false }
